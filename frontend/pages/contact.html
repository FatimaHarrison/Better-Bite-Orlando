<!--Contact list for user to reach out to us-->
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact Us | Better Bite Orlando</title>
    <!-- Google Font -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet">

    <!-- Bootstrap Icons -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">

    <!-- Shared Site CSS -->
    <link rel="stylesheet" href="../css/bootstrap-custom.min.css">
    <link rel="stylesheet" href="../css/theme.css">
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/footer.css">
    <!-- Contact CSS -->
    <link rel="stylesheet" href="../css/contact.css">
</head>
<body>
    <!-- NAVBAR -->
    <div id="site-navbar"></div>
    <!--Main section of page-->
    <main class="contact-page">
        <div class="contact-container">
            <!--Top portion-->
            <h1>Contact Us 🍙</h1>
            <div class="contact-card">
                <!-- Users' contact input section -->
                <div class="contact-form-section">
                    <!--User contact form information-->
                    <form>
                        <div class="form-group">
                            <label>Full Name</label>
                            <input type="text" placeholder="Enter your name">
                        </div>
                        <div class="form-group">
                            <label>Email</label>
                            <input type="email" placeholder="Enter your email">
                        </div>
                        <div class="form-group">
                            <label>Message</label>
                            <textarea rows="5"
                                placeholder="Tell us how we can help..."></textarea>
                        </div>
                        <button type="submit" class="contact-btn">
                            Contact Us
                        </button>

                    </form>
                </div>
                <!-- BBO short information -->
                <div class="contact-info">
                    <div class="info-block">
                        <h3>Contact📞</h3>
                        <p>info@betterbiteorlando.com</p>
                    </div>
                    <div class="info-block">
                        <h3>Based In📍</h3>
                        <p>
                            Orlando, Florida
                        </p>
                    </div>
                    <!--Short desrciption of our mission-->
                    <div class="info-block">
                        <h3>Our Mission🎯</h3>
                        <p>
                        Helping Orlando families find healthy food,
                        restaurants, recipes, and nutrition resources.
                        </p>
                    </div>
                </div>
            </div>
        </div>
    </main>
   <style>
    main{
        padding-bottom: 93px;
    }
   </style>
    <!-- Bottom footer -->
    <div id="footer-container"></div>
    <script src="../js/navbar.js"></script>
    <script src="../js/footer.js"></script>
</body>
</html>
<!--Fatima's section-->
