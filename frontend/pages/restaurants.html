<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="Discover nutritious and affordable restaurants in Orlando."
    >

    <title>Healthy Restaurants | Better Bite Orlando</title>

    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- Bootstrap Icons -->
    <link
        rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css"
    >

    <!-- Bootstrap Custom Theme -->
    <link
        rel="stylesheet"
        href="../css/bootstrap-custom.min.css"
    >

    <!-- Global Theme -->
    <link rel="stylesheet" href="../css/theme.css">

    <!-- Shared Components -->
    <link rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/footer.css">

    <!-- Restaurant Page -->
    <link rel="stylesheet" href="../css/restaurants.css">

    <!-- Leaflet Map CSS -->
<link
    rel="stylesheet"
    href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"
>

</head>


<body>

     <!-- Shared Navigation -->
    <div id="site-navbar"></div>

    <main>

        <!-- HERO SECTION -->
        <section class="hero">

            <div class="hero-content">
                <h1>Healthy Restaurants in Orlando</h1>

                <p>
                    Find nutritious and affordable meals at local restaurants.
                </p>
            </div>

        </section>


        <!-- FILTER PANEL -->
        <section class="filter-panel">

            <div class="filter-group distance-group">

                <label for="distance">
                    How far are you willing to travel?
                </label>

                <select id="distance">
                    <option value="1">1 mile</option>
                    <option value="3">3 miles</option>
                    <option value="5" selected>5 miles</option>
                    <option value="10">10 miles</option>
                </select>

            </div>


            <div class="filter-group dietary-group">

                <label>Dietary Preference</label>

                <div class="diet-options">

                    <label>
                        <input type="checkbox" value="vegetarian">
                        Vegetarian
                    </label>

                    <label>
                        <input type="checkbox" value="vegan">
                        Vegan
                    </label>

                    <label>
                        <input type="checkbox" value="gluten_free">
                        Gluten-Free
                    </label>

                    <label>
                        <input type="checkbox" value="organic">
                        Organic
                    </label>

                </div>

            </div>


            <div class="filter-group location-group">

                <label for="location">Location</label>

                <div class="location-input">
                    <span>⌖</span>

                    <input
                        id="location"
                        type="text"
                        placeholder="Enter ZIP code"
                        inputmode="numeric"
                        pattern="[0-9]{5}"
                        maxlength="5"
                        aria-label="ZIP Code"
                    >
                </div>

            </div>


            <div class="filter-group cuisine-group">

                <label for="cuisine">Cuisine</label>

                <select id="cuisine">
                    <option value="">All Cuisines</option>
                    <option value="Mexican">Mexican</option>
                    <option value="Italian">Italian</option>
                    <option value="American">American</option>
                    <option value="Asian">Asian</option>
                </select>

            </div>


            <button id="searchBtn" class="search-button">
                Search
                <span>⌕</span>
            </button>

        </section>


        <!-- RESTAURANT CONTENT -->
        <section class="restaurant-layout" id="restaurants">


            <!-- LEFT RESTAURANT GRID -->
            <div class="restaurant-column">

                <div class="results-heading">

                    <h2>Explore Restaurants</h2>

                    <span id="resultCount"></span>

                </div>


                <div id="restaurantGrid" class="restaurant-grid">

                    <!-- RESTAURANTS GENERATED BY JAVASCRIPT -->

                </div>


                <p id="emptyMessage" class="empty-message" hidden>
                    No restaurants found. Try changing your filters.
                </p>

            </div>


            <!-- RIGHT DETAILS PANEL -->
            <aside class="details-panel" id="detailsPanel">

                <!-- interactive restaurant app -->
                <div
                    id="restaurant-map"
                    aria-label="Map showing nearby restaurants"
                ></div>

                <!-- Selected restaurants details -->
                <div id="detailsContent">

                    <p class="empty-details">
                    Select a restaurant to view its details.
                    </p>

                </div>

            </aside>

        </section>


        <!-- FAVORITES SECTION -->
        <section class="favorites-section" id="favorites">

            <h2>Your Favorite Restaurants</h2>

            <div id="favoriteList" class="favorite-list">

                <p>You haven't saved any favorites yet.</p>

            </div>

        </section>


    </main>

     <!-- Shared Footer -->
    <div id="footer-container"></div>

    <!-- Boostrat JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Shared Components -->
    <script src="../js/config.js"></script>
    <script src="../js/navbar.js"></script>
    <script src="../js/footer.js"></script>

<!-- Leaflet Map JavaScript -->
<script
    src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"
    integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo="
    crossorigin=""
></script>

<!-- Healthy Restaurants Functionality -->
<script src="../js/restaurants.js"></script>

</body>
</html>
