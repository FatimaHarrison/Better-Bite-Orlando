<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8"> 
  
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <title>Find Groceries | Better Bite Orlando </title>

  <!-- Google Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  
  <!-- Compiled Better Bite Orlando Bootstrap 5.3.8 theme (includes Bootstrap). -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
  
  <!-- Bootstrap custom theme  CSS -->
  <link rel="stylesheet" href="../css/bootstrap-custom.min.css">
  
  <!-- Global Theme CSS -->
  <link rel="stylesheet" href="../css/theme.css">
  

  <!-- Shared components  CSS -->
  <link rel="stylesheet" href="../css/navbar.css">
  <link rel="stylesheet" href="../css/footer.css">

  <!-- Groceries Page CSS -->
  <link rel="stylesheet" href="../css/groceries.css">
  
</head>

<body>

    <!-- Shared Navigation -->
    <div id="site-navbar"></div>
<main>

    <!-- Hero Section -->
     <section class="groceries-hero">

        <div class="container-xl">

            <div class="groceries-intro">

                <h1>Find Groceries Near You</h1>

                <p>
                    Grocery stores, farmer's markets,
                    food pantries and more.
                </p>

            </div>

            <!-- Search section -->
             <form id="grocery-search-form" class="grocery-search">

                <div class="row g-3 align-items-center">

                    <!-- Zip cpde -->
                     <div class="col-12 col-md-6 col-lg-3">

                        <label for="grocery-zip" class="visually-hidden">
                            ZIP Code
                        </label>

                        <div class="input-group">

                            <span class="input-group-text">
                                <i class="bi bi-geo-alt"></i>
                            </span>

                            <input 
                                type="text"
                                id="grocery-zip"
                                class="form-control"
                                placeholder="Enter ZIP Code"
                                value="32805"
                                inputmode="numeric"
                                pattern="[0-9]{5}"
                                maxlength="5"
                                required
                            >

                            </div>

                     </div>

                     <!-- Category -->
                      <div class="col-12 col-md-6 col-lg-3">

                        <label for="grocery-category" class="visually-hidden">
                            Category
                        </label>

                        <select 
                            id="grocery-category"
                            class="form-select"
                            >

                            <option value="all">All categories</option>
                            <option value="groceries">Grocery Stores</option>
                            <option value="farmers-markets">Farmers Markets</option>
                            <option value="food-pantries">Food Pantries</option>

                        </select>

                    </div>


                <!-- Availability -->
                 <div class="col-12 col-md-6 col-lg-3">

                    <label for="grocery-availability" class="visually-hidden">
                        Availability
                    </label>

                   <select 
                            id="grocery-availability"
                            class="form-select"
                    >

                            <option value="all">
                                Availability
                            </option>

                            <option value="open">
                                Open Now
                            </option>

                        </select>

                 </div>

                 <!-- Search Button -->
                 <div class="col-12 col-md-6 col-lg-3">
                    
                    <button 
                        type="submit"
                        class="btn btn-primary grocery-search-btn w-100"
                        >

                        Search 

                        <i class="bi bi-search ms-2"></i>

                    </button>

                </div>
            
            </div>    

        </form>

        </div>

     </section>


     <!-- Category Navigation -->
      <section class="grocery-categories container-xl">

        <div class="category-navigation" role="group" aria-label="Grocery categories">

            <button 
                type="button"
                class="category-btn active"
                data-category="all"
                aria-pressed="true"
            >

            <i class="bi bi-grid"></i>

            All
            
            </button>

            <button 
                type="button"
                class="category-btn"
                data-category="groceries"
                aria-pressed="false"
            >

            <i class="bi bi-cart"></i>

            Grocery Stores
            
            </button>

            <button 
                type="button"
                class="category-btn"
                data-category="farmers-markets"
                aria-pressed="false"
            >

            <i class="bi bi-flower1"></i>

            Farmers Markets
            
            </button>

               <button 
                type="button"
                class="category-btn"
                data-category="food-pantries"
                aria-pressed="false"
            >

            <i class="bi bi-people"></i>

            Food Pantries
            
            </button>

        </div>

      </section>




      <!-- Results section -->
       <section class="grocery-results container-xl">

        <div class="row g-3">

            <!-- left results -->
             <div class="col-12 col-lg-5">

                <div class="results-header">

                    <h2>
                        Results
                        (<span id="results-count">0</span>)
                    </h2>

                    <div class="results-sort">

                        <label for="grocery-sort" class="grocery-sort">
                            Sort by
                        </label>

                        <select 
                            id="grocer-sort"
                            class="form-select"
                    >

                            <option value="distance">
                                Distance
                            </option>

                            <option value="name">
                                Name
                            </option>

                        </select>

                    </div>
                    
                </div>


                <!-- Grocery cards will appear here -->
                 <div id="grocery-results-list">

                    <p class="grocery-empty-message">
                        Grocery location will appear here.
                    </p>

                 </div>

             </div>

             <!-- right map -->
              <div class="col-12 col-lg-7">

                <div id="grocery-map" class="grocery-map">

                    <div class="map-placeholder">

                        <i class="bi bi-map"></i>

                        <h3> Grocery Location </h3>

                        <p>
                            Map integration coming soon.
                        </p>

                    </div>

                </div>

            </div>

        </div>

       </section>


       <!-- Grocery Details Modal -->
        <div 
            class="modal fade"
            id="groceryDetailsModal"
            tabindex="-1"
            aria-labelledby="groceryDetailsModalLabel"
            aria-hidden="true"
        >

            <div class="modal-dialog modal-dialog-centered modal-lg">

                <div class="modal-content grocery-details-modal">

                    <div class="modal-header">

                        <h2 
                            class="modal-title visually-hidden"
                            id="groceryDetailsModalLabel"
                        >
                            Grocery Details 
                    </h2>

                    <button
                        type="button"
                        class="btn-close"
                        data-bs-dismiss="modal"
                        aria-label="Close"
                    ></button>

                </div>

                <div 
                class="modal-body"
            id="grocery-details-content"
            >
                
            <!-- Grcoery details populated by JS -->
        </div>

    </div>
    </div>
    </div>
    </div>




    </main>

     <!-- Shared Footer -->
    <div id="footer-container"></div>


    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>

    <!-- Shared Components JS -->
    <script src="../js/navbar.js"></script>
    <script src="../js/footer.js"></script>

    <!-- Groceries functionality -->
     <script src="../js/groceries.js"></script>

</body>
</html>
